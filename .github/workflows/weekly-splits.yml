name: Weekly Splits Update

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      time_range:
        description: 'Time range to search (e.g., "last 8 days", "January 2026", "2024")'
        required: false
        default: 'last 8 days'

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write  # dispatch Validate Data on the PR branch

concurrency:
  group: weekly-splits
  cancel-in-progress: false

jobs:
  update-splits:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Passed via env (never interpolated into shell) to avoid script injection.
      TIME_RANGE: ${{ github.event.inputs.time_range || 'last 8 days' }}
      # SEC fair-access policy: automated requests must declare a contact email.
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create branch
        run: |
          BRANCH_NAME="auto/splits-$(date +%Y%m%d)-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Research and add splits
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without an explicit allowlist the agent cannot edit files or run curl/npm,
          # and the job "succeeds" with no changes.
          claude_args: >-
            --max-turns 150
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(curl:*),Bash(jq:*),Bash(npm run validate),Bash(date:*),Bash(git diff:*),Bash(git status)"
          prompt: |
            Research and add stock split data for this time range: ${{ env.TIME_RANGE }}

            Follow CONTRIBUTING.md ("Research Procedure") and these rules:

            1. Parse the time range into start/end dates (today is the run date).
            2. Load the relevant data/YYYY.json file(s); skip SYMBOL:DATE pairs that already exist.
            3. Discover candidates via SEC EDGAR full-text search (8-K/6-K: "stock split",
               "reverse stock split", "share consolidation", "stock dividend") and the
               Nasdaq Trader equity corporate actions alerts. Aggregators may be used for
               discovery only.
               For every sec.gov request use curl with the declared User-Agent:
               `curl -s --compressed -A "$SEC_USER_AGENT" <url>` (WebFetch is blocked by SEC).
               Stay under 10 requests/second. If SEC still returns 403, fall back to
               WebSearch to locate sec.gov filing URLs.
            4. For each candidate, open the primary source and extract symbol, name, date,
               ratioNew, ratioOld, exchange, isin (if stated), source, notes.
               - `date` = FIRST SPLIT-ADJUSTED TRADING DAY (ex-date), not record/payable date.
               - `source` MUST be a primary source: sec.gov, nasdaqtrader.com, a newswire
                 (globenewswire/prnewswire/businesswire/accessnewswire) or the company IR site.
                 Never stocktitan, tipranks, yahoo, marketscreener, investing.com, etc.
               - Only US-listed securities (NASDAQ, NYSE, NYSE American, NYSE Arca, Cboe, OTC with SEC filings).
               - Only splits that have already taken effect. Skip announced-only splits.
               - Skip reverse/forward freeze-out combinations (net share reduction to cash out holders).
               - If several share classes split (e.g. GOOG and GOOGL), add one entry per listed class.
            5. Insert entries sorted by symbol then date; set "updated" to today's date.
            6. Run `npm run validate` and fix every error.
            7. Print a summary of added / skipped (with reason) / errored candidates.

            Only modify files under data/. Do not commit or push.

      - name: Validate data
        run: npm run validate

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No new splits found for $TIME_RANGE"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Add stock splits for $TIME_RANGE" \
            -m "Automated weekly update via SEC EDGAR research." \
            -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin "$BRANCH_NAME"

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGES=$(git diff HEAD~1 --stat -- data/ | tail -1)
          {
            echo "## Summary"
            echo
            echo "Automated weekly stock splits update for **$TIME_RANGE**, researched from SEC EDGAR filings and exchange notices."
            echo
            echo "**Changes:** $CHANGES"
            echo
            echo "Validation (\`npm run validate\`) passed in the generating workflow, and the Validate Data check is dispatched on this branch."
            echo
            echo "## Review Checklist"
            echo
            echo "- [ ] Ratios are correct (ratioNew/ratioOld integers)"
            echo "- [ ] Dates are the first split-adjusted trading day"
            echo "- [ ] Every source is a primary source (SEC, Nasdaq Trader, newswire, company IR)"
            echo "- [ ] Spot-checked 2-3 entries against their filings"
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --title "Add stock splits for $TIME_RANGE" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows,
          # but workflow_dispatch is allowed; its check run lands on the head commit
          # and satisfies the required "validate" check.
          gh workflow run validate-data.yml --ref "$BRANCH_NAME"
